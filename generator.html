<script>

/* 사용하지 않을 광고 표현 */
const bannedWords = [
  "무료",
  "무료상담",
  "전문",
  "전담",
  "최고",
  "최저",

/* 도입부 */
const intros = [

`매달 대출과 카드대금을 갚고 있어도
원금이 좀처럼 줄어들지 않고
이자 부담까지 계속 커지고 있다면
현재의 채무 상황을 다시 살펴볼 필요가 있습니다.

처음에는 조금만 더 버티면 괜찮아질 거라 생각하지만

`꾸준히 소득이 발생하고 있는데도

`대출 원금과 이자가 계속 쌓이고
매월 상환해야 하는 금액 때문에
경제적인 부담을 느끼는 경우가 있습니다.

특히 연체가 시작되거나

막연하게 미루기보다 현재 채무와 소득 상황을
구체적으로 확인해 보는 것이 중요합니다.`,

`열심히 채무를 상환하고 있어도
이자 때문에 원금이 줄지 않는다면
상환 방식 자체를 다시 검토해야 할 수 있습니다.

현재 소득과 재산으로 전체 채무를
감당하기 어려운 상황이라면
개인회생 신청 요건에 해당하는지
먼저 확인해 보는 것이 좋습니다.`,

`채무가 늘어나면서
매달 돌아오는 상환일이 부담스럽게 느껴지고
일상생활까지 영향을 받고 있다면
혼자 고민만 이어갈 필요는 없습니다.

개인회생은 일정한 요건을 충족하는 경우
법원의 절차를 통해 채무조정을
검토할 수 있도록 마련된 제도입니다.`

];


/* 개인회생 설명 */
const explanations = [

`개인회생은 일정한 수입이 있지만

`개인회생 제도는 계속적 또는 반복적인 수입이 있으면서

];


/* 직업 설명 */
const jobTexts = [

`직업의 종류는 사람마다 다를 수 있습니다.

];


/* 준비사항 */
const prepareTexts = [

`소득과 재산, 채무 규모와 발생 경위 등은

구체적인 상황에 따라 추가적인 소명이나
자료가 요구될 수도 있습니다.`,

`같은 금액의 채무가 있다고 해도
월 소득과 보유 재산, 부양가족,
채무가 발생하게 된 과정은 모두 다를 수 있습니다.

따라서 다른 사례만 보고 판단하기보다

확인하는 것이 중요합니다.`,

`개인회생 절차에서는

법원의 심사 과정에서
추가적인 자료 제출이나 보정이 필요한 경우도 있어
신청 전에 필요한 내용을 정리하는 것이 좋습니다.`

];


/* 마무리 */
const endings = [

`채무가 많다고 해서
모두 같은 방법으로 해결해야 하는 것은 아닙니다.

현재 가지고 있는 채무와 소득, 재산을 정리하고
본인에게 적합한 방법이 무엇인지
확인해 보는 것이 중요합니다.`,

`개인회생 신청 가능 여부는

확인해 보시기 바랍니다.`,

`채무 문제를 계속 미루기보다
현재 경제 상황부터 정확하게 확인하는 것이 중요합니다.

개인회생을 알아보고 있다면
신청 가능 여부와 준비해야 할 내용을
상담을 통해 확인해 볼 수 있습니다.`

];


function pick(arr,index,offset=0){
  return arr[(index + offset) % arr.length];
}


function cleanKeyword(word){

  let result = word.trim();

  bannedWords.forEach(b => {
    result = result.split(b).join("");
  });

  return result.trim();
}


function shuffle(arr,seed){

  let a = [...arr];

  for(let i=a.length-1;i>0;i--){

    const j = (seed * 7 + i * 13) % (i+1);

    [a[i],a[j]] = [a[j],a[i]];
  }

  return a;
}


function slugRegion(region,index){

  const roman = [
    "seoul","busan","daegu","incheon","gwangju",
    "daejeon","ulsan","suwon","goyang","yongin",
    "changwon","seongnam","cheongju","bucheon","ansan",
    "jeonju","anyang","pohang","gimhae","pyeongtaek"
  ];

  return roman[index % roman.length] +
         "-personal-rehabilitation-" +
         String(index+1).padStart(2,"0");
}


function makeTitle(region,keywords,index){

  const safe = keywords
    .map(cleanKeyword)
    .filter(Boolean);

  const mixed = shuffle(safe,index+1);

  const count = Math.min(
    mixed.length,
    index % 2 === 0 ? 3 : 4
  );

  return region + " " + mixed.slice(0,count).join(" ");
}


function nl(text){

  return text
    .split("\n\n")
    .map(p =>
      "<p>" +
      p.replace(/\n/g,"<br>") +
      "</p>"
    )
    .join("\n");
}


function makePage(region,keywords,index,link){

  const title = makeTitle(region,keywords,index);

  const intro = pick(intros,index);
  const explanation = pick(explanations,index,1);
  const jobs = pick(jobTexts,index,2);
  const preparation = pick(prepareTexts,index,1);
  const ending = pick(endings,index,2);


return `<!DOCTYPE html>

async function generateAll(){

  const regions =
    document.getElementById("regions")
    .value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean)
    .slice(0,50);


  const keywords =
    document.getElementById("keywords")
    .value
    .split("\n")
    .map(v=>v.trim())
    .filter(Boolean);


  const link =
    document.getElementById("link")
    .value
    .trim();


  if(regions.length === 0){

    alert("지역을 입력해 주세요.");
    return;

  }


  if(keywords.length === 0){

    alert("제목 키워드를 입력해 주세요.");
    return;

  }


  const zip = new JSZip();

  const titles = [];


  regions.forEach((region,index)=>{

    const title =
      makeTitle(region,keywords,index);

    const file =
      slugRegion(region,index) + ".html";

    const html =
      makePage(
        region,
        keywords,
        index,
        link
      );

    zip.file(file,html);

    titles.push(
      `${index+1}. ${title}<br>→ ${file}`
    );

  });


  const blob =
    await zip.generateAsync({
      type:"blob"
    });


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "personal-rehabilitation-pages.zip";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);


  const result =
    document.getElementById("result");


  result.style.display = "block";

  result.innerHTML =
    `<strong>${regions.length}개 글 생성 완료</strong><br><br>` +
    titles.join("<br><br>");

}

</script>

</body>
