<script>

/* 광고 시 제외할 표현 */

`매달 대출과 카드대금을

소득만으로 채무를 감당하기 어려워지고

현재 채무와 재산,

`열심히 채무를 상환하고 있는데도
이자 때문에 원금이 줄지 않고
경제적인 부담이 계속되고 있나요?

기존 채무를 갚기 위해
새로운 대출을 이용하는 상황까지 이어진다면
개인회생 신청요건에 해당하는지
살펴볼 필요가 있습니다.`,

`처음에는 충분히 갚을 수 있을 거라 생각했던 채무도

감당하기 어려워질 수 있습니다.

현재 소득으로 정상적인 상환이 어렵다면

`원금과 이자를 갚느라

];


/* 개인회생 설명 */

/* 직업 관련 문장 */
const jobTexts = [

];

신청 가능 여부와 필요한 준비사항을

function cleanKeyword(word) {

  let cleaned = word.trim();

  bannedWords.forEach(function(banned) {
    cleaned = cleaned.split(banned).join("");
  });

  return cleaned.trim();
}


function pick(array, index, offset = 0) {
  return array[(index + offset) % array.length];
}


function shuffle(array, seed) {

  const copy = [...array];

  for(let i = copy.length - 1; i > 0; i--) {

    const j = (seed * 11 + i * 17) % (i + 1);

    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}


function createTitle(region, keywords, index) {

  const safeKeywords = keywords
    .map(cleanKeyword)
    .filter(Boolean);

  const mixed = shuffle(safeKeywords, index + 3);

  let count = 3;

  if(index % 3 === 1) count = 4;
  if(index % 3 === 2) count = 3;

  return region + " " +
    mixed.slice(0, Math.min(count, mixed.length)).join(" ");
}


/* 파일명용 */
function makeFileName(index) {

  return "personal-rehabilitation-" +
    String(index + 1).padStart(2, "0") +
    ".html";
}


function paragraphs(text) {

  return text
    .split("\n\n")
    .map(function(block) {

      return "<p>" +
        block.replace(/\n/g, "<br>") +
        "</p>";

    })
    .join("\n");
}


function createHTML(region, keywords, index, consultLink) {

const title = createTitle(region, keywords, index);

const intro = pick(intros, index);

const jobs =

async function generatePages() {

  const regions =
    document
    .getElementById("regions")
    .value
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean)
    .slice(0, 30);


  const keywords =
    document
    .getElementById("keywords")
    .value
    .split("\n")
    .map(v => v.trim())
    .filter(Boolean);


  const consultLink =
    document
    .getElementById("consultLink")
    .value
    .trim();


  if(regions.length === 0) {

    alert("지역을 입력해 주세요.");
    return;
  }


  if(keywords.length === 0) {

    alert("제목 키워드를 입력해 주세요.");
    return;
  }


  const zip = new JSZip();

  let preview = [];


  regions.forEach(function(region, index) {

    const filename =
      makeFileName(index);

    const title =
      createTitle(region, keywords, index);

    const html =
      createHTML(
        region,
        keywords,
        index,
        consultLink
      );


    zip.file(filename, html);


    preview.push(
      "<strong>" +
      (index + 1) +
      ". " +
      title +
      "</strong><br>" +
      filename
    );

  });


  const blob =
    await zip.generateAsync({
      type: "blob"
    });


  const url =
    URL.createObjectURL(blob);


  const download =
    document.createElement("a");


  download.href = url;

  download.download =
    "seoyul-personal-rehabilitation-30.zip";


  document.body.appendChild(download);

  download.click();

  download.remove();

  URL.revokeObjectURL(url);


  const result =
    document.getElementById("result");


  result.style.display =
    "block";


  result.innerHTML =
    "<strong>" +
    regions.length +
    "개 페이지 생성 완료</strong><br><br>" +
    preview.join("<br><br>");

}

</script>
